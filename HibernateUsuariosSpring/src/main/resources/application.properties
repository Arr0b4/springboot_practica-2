# Base de datos y puerto real de MariaDB.
spring.datasource.url=jdbc:mariadb://localhost:3306/tutorial
spring.datasource.username=root
spring.datasource.password=root
# Mostrar las sentencias SQL que genera Hibernate.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Al principio utilizamos las tablas ya creadas.
spring.jpa.hibernate.ddl-auto=none
# Aplicación de consola; no se inicia un servidor web.
spring.main.web-application-type=none
# Por ahora ejecutamos únicamente el CRUD de usuarios.
spring.profiles.active=usuarios